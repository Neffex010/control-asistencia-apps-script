<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .contenedor { max-width: 760px; margin: 0 auto; padding: 16px; }
    .panel { background: white; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { margin: 0 0 6px; font-size: 1.45rem; }
    .subtitulo { margin: 0; color: #6b7280; }
    label { display: block; margin-bottom: 6px; font-weight: 700; }
    select, button { width: 100%; min-height: 48px; border-radius: 10px; font-size: 1rem; }
    select { border: 1px solid #d1d5db; padding: 10px; background: white; }
    button { border: 0; padding: 12px 14px; font-weight: 700; cursor: pointer; }
    .btn-secundario { background: #e5e7eb; color: #111827; }
    .btn-principal { background: #111827; color: white; margin-top: 12px; }
    .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .resumen { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 12px; font-weight: 700; }
    .participante { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #e5e7eb; }
    .participante:last-child { border-bottom: 0; }
    .nombre { font-weight: 700; }
    .correo { color: #6b7280; font-size: .9rem; overflow-wrap: anywhere; }
    .switch { width: 26px; height: 26px; }
    .mensaje { margin-top: 12px; padding: 10px; border-radius: 8px; display: none; }
    .ok { display: block; background: #dcfce7; color: #166534; }
    .error { display: block; background: #fee2e2; color: #991b1b; }
    .cargando { display: none; text-align: center; padding: 12px; color: #4b5563; }
    @media (max-width: 520px) {
      .contenedor { padding: 10px; }
      .acciones { grid-template-columns: 1fr; }
      .panel { padding: 14px; }
    }

    h1 {
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      .panel { background: #1f2937; box-shadow: 0 4px 6px -1px rgba(0,0,0,.4); }
      .subtitulo, .correo { color: #9ca3af; }
      select, input[type="search"] { background: #374151; color: #f9fafb; border-color: #4b5563; }
      .btn-secundario { background: #374151; color: #f9fafb; }
      .btn-principal { background: #3b82f6; }
      .participante { border-bottom-color: #374151; }
      .ok { background: #064e3b; color: #a7f3d0; }
      .error { background: #7f1d1d; color: #fecaca; }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: #16a34a;
      color: white;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0,0,0,.25);
      transition: transform .3s ease;
      z-index: 9999;
      max-width: 90%;
      text-align: center;
    }
    .toast.mostrar { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #dc2626; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <main class="contenedor">
    <section class="panel">
      <h1>Control de asistencia</h1>
      <p class="subtitulo">30 participantes · 10 sesiones</p>
    </section>

    <section class="panel">
      <label for="sesion">Sesión</label>
      <select id="sesion">
        <option value="">Selecciona una sesión</option>
      </select>

      <div class="acciones">
        <button class="btn-secundario" onclick="marcarTodos(true)"><i class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:4px;">check_circle</i>Marcar todos</button>
        <button class="btn-secundario" onclick="marcarTodos(false)"><i class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:4px;">cancel</i>Desmarcar todos</button>
      </div>

      <div class="resumen">
        <span id="contador">Presentes: 0 / 0</span>
        <span id="estadoSesion"></span>
      </div>

      <div style="height:8px;background:#e5e7eb;border-radius:4px;margin-top:10px;overflow:hidden;">
        <div id="barra" style="height:100%;width:0%;background:#16a34a;border-radius:4px;transition:width .2s;"></div>
      </div>
    </section>

    <section class="panel">
      <input id="buscador" type="search" placeholder="Buscar por nombre o ID..." style="width:100%;min-height:44px;padding:10px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:10px;font-size:1rem;">

      <div id="cargando" class="cargando">Cargando...</div>
      <div id="lista"></div>

      <button id="guardar" class="btn-principal" onclick="guardar()" disabled>
        <i class="material-icons" style="font-size:18px;vertical-align:middle;margin-right:4px;">save</i>
        Guardar asistencia
      </button>

      <div id="mensaje" class="mensaje"></div>
    </section>
  </main>

  <script>
    let participantes = [];
    let sesiones = [];

    document.addEventListener('DOMContentLoaded', cargarSesiones);
    document.getElementById('sesion').addEventListener('change', cargarParticipantes);
    document.getElementById('buscador').addEventListener('input', renderParticipantes);

    function cargarSesiones() {
      mostrarCarga(true);
      google.script.run
        .withSuccessHandler(datos => {
          sesiones = datos || [];
          const select = document.getElementById('sesion');
          sesiones.forEach(s => {
            const option = document.createElement('option');
            option.value = s.id;
            const estado = s.estado ? `[${s.estado}]` : '';
            option.textContent = `Sesión ${s.numero} - ${s.fecha || 'sin fecha'} · ${s.tema} ${estado}`;
            select.appendChild(option);
          });
          mostrarCarga(false);
        })
        .withFailureHandler(mostrarError)
        .obtenerSesiones();
    }

    function cargarParticipantes() {
      const idSesion = document.getElementById('sesion').value;
      document.getElementById('lista').innerHTML = '';
      document.getElementById('guardar').disabled = true;

      if (!idSesion) {
        participantes = [];
        actualizarContador();
        document.getElementById('estadoSesion').textContent = '';
        return;
      }

      const sesion = sesiones.find(s => s.id === idSesion);
      document.getElementById('estadoSesion').textContent = sesion ? sesion.estado : '';

      mostrarCarga(true);
      google.script.run
        .withSuccessHandler(datos => {
          participantes = datos || [];
          renderParticipantes();
          mostrarCarga(false);
          document.getElementById('guardar').disabled = false;
        })
        .withFailureHandler(mostrarError)
        .obtenerParticipantes(idSesion);
    }

    function renderParticipantes() {
      const lista = document.getElementById('lista');
      lista.innerHTML = '';

      const filtro = (document.getElementById('buscador').value || '').trim().toLowerCase();
      const visibles = filtro
        ? participantes.filter(p =>
            String(p.nombre).toLowerCase().includes(filtro) ||
            String(p.id).toLowerCase().includes(filtro))
        : participantes;

      visibles.forEach((p) => {
        const indice = participantes.indexOf(p);

        const fila = document.createElement('div');
        fila.className = 'participante';

        const datos = document.createElement('div');
        datos.innerHTML = `
          <div class="nombre">${p.id} · ${escapar(p.nombre)}</div>
          <div class="correo">${escapar(p.correo)}</div>
        `;

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'switch';
        check.checked = Boolean(p.presente);
        check.addEventListener('change', () => {
          participantes[indice].presente = check.checked;
          actualizarContador();
        });

        fila.appendChild(datos);
        fila.appendChild(check);
        lista.appendChild(fila);
      });

      if (visibles.length === 0 && participantes.length > 0) {
        lista.innerHTML = '<p style="text-align:center;color:#6b7280;padding:12px;">Sin resultados.</p>';
      }

      actualizarContador();
    }

    function marcarTodos(valor) {
      participantes = participantes.map(p => ({ ...p, presente: valor }));
      renderParticipantes();
    }

    function actualizarContador() {
      const presentes = participantes.filter(p => p.presente).length;
      document.getElementById('contador').textContent =
        `Presentes: ${presentes} / ${participantes.length}`;

      const total = participantes.length || 1;
      const porcentaje = Math.round((presentes / total) * 100);
      document.getElementById('barra').style.width = porcentaje + '%';
    }

    function guardar() {
      const idSesion = document.getElementById('sesion').value;

      if (!confirm('¿Guardar la asistencia de esta sesión?')) return;

      if (!idSesion) {
        mostrarMensaje('Selecciona una sesión.', false);
        return;
      }

      document.getElementById('guardar').disabled = true;
      mostrarCarga(true);

      google.script.run
        .withSuccessHandler(resultado => {
          mostrarCarga(false);
          document.getElementById('guardar').disabled = false;
          mostrarMensaje(
            `Guardado: ${resultado.presentes} presentes y ${resultado.ausentes} ausentes.`,
            true
          );

          mostrarToast(`Guardado: ${resultado.presentes} presentes, ${resultado.ausentes} ausentes.`);
          if (typeof confetti === 'function') {
            confetti({ particleCount: 80, spread: 70, origin: { y: 0.7 } });
          }

          const sesion = sesiones.find(s => s.id === idSesion);
          if (sesion) {
            sesion.estado = 'REGISTRADA';
            document.getElementById('estadoSesion').textContent = 'REGISTRADA';
          }
        })
        .withFailureHandler(error => {
          document.getElementById('guardar').disabled = false;
          mostrarError(error);
        })
        .guardarAsistencia(idSesion, participantes);
    }

    function mostrarCarga(visible) {
      document.getElementById('cargando').style.display = visible ? 'block' : 'none';
    }

    function mostrarError(error) {
      mostrarCarga(false);
      const texto = error && error.message ? error.message : String(error);
      mostrarMensaje(texto, false);
      mostrarToast(texto, true);
    }

    function mostrarMensaje(texto, correcto) {
      const mensaje = document.getElementById('mensaje');
      mensaje.textContent = texto;
      mensaje.className = `mensaje ${correcto ? 'ok' : 'error'}`;
    }

    function escapar(texto) {
      return String(texto ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function mostrarToast(texto, esError) {
      const toast = document.getElementById('toast');
      toast.textContent = texto;
      toast.className = 'toast mostrar' + (esError ? ' error' : '');
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }
  </script>

  <div id="toast" class="toast"></div>
</body>
</html>
