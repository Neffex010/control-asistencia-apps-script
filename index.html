<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fondo: #f7f6f3;
      --panel: #ffffff;
      --texto: #1a202c;
      --texto-suave: #718096;
      --borde: #e2e0da;
      --borde-fuerte: #cbd0d9;
      --acento: #4a5568;
      --acento-hover: #2d3748;
      --exito: #2f855a;
      --peligro: #c53030;
      --alerta: #b7791f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--fondo);
      color: var(--texto);
      -webkit-font-smoothing: antialiased;
      padding-bottom: 140px;
    }

    .contenedor { max-width: 760px; margin: 0 auto; padding: 16px; }

    h1 {
      margin: 0 0 2px;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--texto);
    }

    .subtitulo {
      margin: 0;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--texto-suave);
      font-weight: 500;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--texto-suave);
      font-weight: 600;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--borde);
      border-radius: 6px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: none;
    }

    select, input[type="search"] {
      width: 100%;
      border: 1px solid var(--borde-fuerte);
      border-radius: 4px;
      padding: 10px 12px;
      background: var(--panel);
      color: var(--texto);
      font-family: inherit;
      font-size: .92rem;
      min-height: 42px;
    }
    select:focus, input[type="search"]:focus {
      outline: none;
      border-color: var(--acento);
      box-shadow: 0 0 0 3px rgba(74,85,104,.12);
    }
    input[type="search"] { margin-bottom: 10px; }

    button { cursor: pointer; font-family: inherit; }

    .btn-secundario {
      width: 100%;
      min-height: 42px;
      background: transparent;
      color: var(--texto);
      border: 1px solid var(--borde-fuerte);
      border-radius: 4px;
      padding: 10px 14px;
      font-weight: 600;
      font-size: .88rem;
      transition: background .15s, border-color .15s;
    }
    .btn-secundario:hover {
      background: rgba(0,0,0,.03);
      border-color: var(--texto-suave);
    }

    .btn-principal {
      width: 100%;
      min-height: 46px;
      background: var(--acento);
      color: white;
      border: 0;
      border-radius: 4px;
      padding: 12px 16px;
      font-weight: 600;
      font-size: .92rem;
      letter-spacing: .01em;
    }
    .btn-principal:hover { background: var(--acento-hover); }
    .btn-principal:disabled { opacity: .45; cursor: not-allowed; }

    .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .participante {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--borde);
    }
    .participante:last-child { border-bottom: 0; }

    .nombre {
      font-weight: 500;
      font-size: .92rem;
      color: var(--texto);
      letter-spacing: -0.005em;
    }
    .correo {
      color: var(--texto-suave);
      font-size: .78rem;
      margin-top: 2px;
      overflow-wrap: anywhere;
    }

    .switch {
      width: 22px;
      height: 22px;
      accent-color: var(--acento);
      cursor: pointer;
    }
    .mensaje { margin-top: 12px; padding: 10px 12px; border-radius: 4px; display: none; font-size: .85rem; }
    .ok { display: block; background: #e6f0ea; color: #22543d; }
    .error { display: block; background: #fbeaea; color: #742a2a; }
    .cargando { display: none; text-align: center; padding: 14px; color: var(--texto-suave); font-size: .85rem; }
    @media (max-width: 520px) {
      .contenedor { padding: 10px; }
      .acciones { grid-template-columns: 1fr; }
      .panel { padding: 14px; }
    }

    .toast {
      position: fixed;
      bottom: 150px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1a202c;
      color: #f7fafc;
      padding: 12px 18px;
      border-radius: 4px;
      font-weight: 500;
      font-size: .85rem;
      letter-spacing: .01em;
      z-index: 9999;
      max-width: 90%;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      border-left: 3px solid var(--exito);
    }
    .toast.mostrar {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { border-left-color: var(--peligro); }

    .footer-fijo {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--panel);
      border-top: 1px solid var(--borde);
      padding: 10px 16px 14px;
      box-shadow: none;
      z-index: 500;
    }
    .footer-inner { max-width: 760px; margin: 0 auto; }
    .footer-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: .82rem;
      letter-spacing: .01em;
      color: var(--texto);
      margin-bottom: 6px;
    }
    .footer-barra {
      height: 4px;
      background: var(--borde);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .footer-barra > div {
      height: 100%;
      width: 0%;
      background: var(--exito);
      border-radius: 2px;
      transition: width .2s;
    }
    .footer-fijo .btn-principal { margin: 0; min-height: 46px; }

    .banner-aviso {
      background: #fefae8;
      color: #7c5a1a;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: .82rem;
      margin-top: 10px;
      border-left: 3px solid var(--alerta);
      display: none;
    }
    .banner-aviso.mostrar { display: block; }

    @media (prefers-color-scheme: dark) {
      :root {
        --fondo: #16181d;
        --panel: #1e2128;
        --texto: #e8e6e1;
        --texto-suave: #8a8f99;
        --borde: #2d3138;
        --borde-fuerte: #3a3f47;
        --acento: #8a9bb5;
        --acento-hover: #a0b0c8;
      }
      body { background: var(--fondo); color: var(--texto); }
      .panel { background: var(--panel); border-color: var(--borde); }
      .footer-fijo { background: var(--panel); border-top-color: var(--borde); }
      select, input[type="search"] { background: var(--panel); color: var(--texto); border-color: var(--borde-fuerte); }
      .btn-secundario { color: var(--texto); border-color: var(--borde-fuerte); }
      .banner-aviso { background: #2a2418; color: #e5c98a; }
      .ok { background: #1e2b23; color: #9ae6b4; }
      .error { background: #2b1e1e; color: #feb2b2; }
    }
  </style>
</head>
<body>
  <main class="contenedor">
    <header style="padding:20px 16px 14px;border-bottom:1px solid var(--borde);margin-bottom:16px;">
      <h1 style="margin:0 0 2px;font-size:1.15rem;font-weight:700;color:var(--texto);letter-spacing:-0.01em;">
        Control de asistencia
      </h1>
      <p style="margin:0;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--texto-suave);font-weight:500;">
        30 participantes · 10 sesiones
      </p>
    </header>

    <section class="panel" style="display:flex;gap:10px;align-items:center;justify-content:space-between;">
      <div>
        <strong>Panel de control</strong>
        <div class="subtitulo" style="font-size:.85rem;">Resumen general del curso</div>
      </div>
      <button class="btn-secundario" style="width:auto;padding:10px 16px;" onclick="abrirReportes()">
        Ver reportes
      </button>
    </section>

    <section class="panel">
      <label for="sesion">Sesión</label>
      <select id="sesion">
        <option value="">Selecciona una sesión</option>
      </select>

      <div id="bannerAviso" class="banner-aviso">
        Esta sesión ya fue guardada. Los cambios sobrescribirán los registros existentes.
      </div>

      <div class="acciones">
        <button class="btn-secundario" onclick="marcarTodos(true)">Marcar todos</button>
        <button class="btn-secundario" onclick="marcarTodos(false)">Desmarcar todos</button>
      </div>

      <button class="btn-secundario" style="margin-top:8px;" onclick="exportarCSV()">
        Exportar a CSV
      </button>
    </section>

    <section class="panel">
      <input id="buscador" type="search" placeholder="Buscar por nombre o ID...">

      <div id="cargando" class="cargando">Cargando...</div>
      <div id="lista"></div>

      <div id="mensaje" class="mensaje"></div>
    </section>
  </main>

  <script>
    let participantes = [];
    let sesiones = [];

    document.addEventListener('DOMContentLoaded', cargarSesiones);
    document.getElementById('sesion').addEventListener('change', cargarParticipantes);
    document.getElementById('buscador').addEventListener('input', renderParticipantes);

    function cargarSesiones() {
      mostrarCarga(true);
      google.script.run
        .withSuccessHandler(datos => {
          sesiones = datos || [];
          const select = document.getElementById('sesion');
          sesiones.forEach(s => {
            const option = document.createElement('option');
            option.value = s.id;
            const estado = s.estado ? `[${s.estado}]` : '';
            option.textContent = `Sesión ${s.numero} - ${s.fecha || 'sin fecha'} · ${s.tema} ${estado}`;
            select.appendChild(option);
          });
          mostrarCarga(false);

          const ultima = localStorage.getItem('ultimaSesion');
          if (ultima) {
            const opt = Array.from(select.options).find(o => o.value === ultima);
            if (opt) {
              select.value = ultima;
              cargarParticipantes();
            }
          }
        })
        .withFailureHandler(mostrarError)
        .obtenerSesiones();
    }

    function cargarParticipantes() {
      const idSesion = document.getElementById('sesion').value;
      if (idSesion) localStorage.setItem('ultimaSesion', idSesion);

      document.getElementById('lista').innerHTML = '';
      document.getElementById('guardar').disabled = true;

      if (!idSesion) {
        participantes = [];
        actualizarContador();
        document.getElementById('estadoSesion').textContent = '';
        return;
      }

      const sesion = sesiones.find(s => s.id === idSesion);
      document.getElementById('estadoSesion').textContent = sesion ? sesion.estado : '';

      const banner = document.getElementById('bannerAviso');
      if (sesion && sesion.estado === 'REGISTRADA') {
        banner.classList.add('mostrar');
      } else {
        banner.classList.remove('mostrar');
      }

      mostrarCarga(true);
      google.script.run
        .withSuccessHandler(datos => {
          participantes = datos || [];
          renderParticipantes();
          mostrarCarga(false);
          document.getElementById('guardar').disabled = false;
        })
        .withFailureHandler(mostrarError)
        .obtenerParticipantes(idSesion);
    }

    function renderParticipantes() {
      const lista = document.getElementById('lista');
      lista.innerHTML = '';

      const filtro = (document.getElementById('buscador').value || '').trim().toLowerCase();
      const visibles = filtro
        ? participantes.filter(p =>
            String(p.nombre).toLowerCase().includes(filtro) ||
            String(p.id).toLowerCase().includes(filtro))
        : participantes;

      visibles.forEach((p) => {
        const indice = participantes.indexOf(p);

        const fila = document.createElement('div');
        fila.className = 'participante';

        const datos = document.createElement('div');
        datos.innerHTML = `
          <div class="nombre">${p.id} · ${escapar(p.nombre)}</div>
          <div class="correo">${escapar(p.correo)}</div>
        `;

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.className = 'switch';
        check.checked = Boolean(p.presente);
        check.addEventListener('change', () => {
          participantes[indice].presente = check.checked;
          actualizarContador();
        });

        fila.appendChild(datos);
        fila.appendChild(check);
        lista.appendChild(fila);
      });

      if (visibles.length === 0 && participantes.length > 0) {
        lista.innerHTML = '<p style="text-align:center;color:#6b7280;padding:12px;">Sin resultados.</p>';
      }

      actualizarContador();
    }

    function marcarTodos(valor) {
      participantes = participantes.map(p => ({ ...p, presente: valor }));
      renderParticipantes();
    }

    function actualizarContador() {
      const presentes = participantes.filter(p => p.presente).length;
      document.getElementById('contador').textContent =
        `Presentes: ${presentes} / ${participantes.length}`;

      const total = participantes.length || 1;
      const porcentaje = Math.round((presentes / total) * 100);
      document.getElementById('barra').style.width = porcentaje + '%';
    }

    function guardar() {
      const idSesion = document.getElementById('sesion').value;

      if (!confirm('¿Guardar la asistencia de esta sesión?')) return;

      if (!idSesion) {
        mostrarMensaje('Selecciona una sesión.', false);
        return;
      }

      document.getElementById('guardar').disabled = true;
      mostrarCarga(true);

      google.script.run
        .withSuccessHandler(resultado => {
          mostrarCarga(false);
          document.getElementById('guardar').disabled = false;
          mostrarMensaje(
            `Guardado: ${resultado.presentes} presentes y ${resultado.ausentes} ausentes.`,
            true
          );

          mostrarToast(`Guardado: ${resultado.presentes} presentes, ${resultado.ausentes} ausentes.`);
          if (navigator.vibrate) navigator.vibrate(100);

          const sesion = sesiones.find(s => s.id === idSesion);
          if (sesion) {
            sesion.estado = 'REGISTRADA';
            document.getElementById('estadoSesion').textContent = 'REGISTRADA';
          }
        })
        .withFailureHandler(error => {
          document.getElementById('guardar').disabled = false;
          mostrarError(error);
        })
        .guardarAsistencia(idSesion, participantes);
    }

    function mostrarCarga(visible) {
      document.getElementById('cargando').style.display = visible ? 'block' : 'none';
    }

    function mostrarError(error) {
      mostrarCarga(false);
      const texto = error && error.message ? error.message : String(error);
      mostrarMensaje(texto, false);
      mostrarToast(texto, true);
    }

    function mostrarMensaje(texto, correcto) {
      const mensaje = document.getElementById('mensaje');
      mensaje.textContent = texto;
      mensaje.className = `mensaje ${correcto ? 'ok' : 'error'}`;
    }

    function escapar(texto) {
      return String(texto ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function mostrarToast(texto, esError) {
      const toast = document.getElementById('toast');
      toast.textContent = texto;
      toast.className = 'toast mostrar' + (esError ? ' error' : '');
      setTimeout(() => { toast.className = 'toast'; }, 3000);
    }

    function abrirReportes() {
      mostrarCarga(true);
      google.script.run
        .withSuccessHandler(renderReportes)
        .withFailureHandler(mostrarError)
        .obtenerReporte();
    }

    function renderReportes(data) {
      mostrarCarga(false);
      cerrarReportes();

      let html = '<div style="padding:10px 0;"><h2 style="margin:0 0 12px;">Asistencia por participante</h2><table style="width:100%;border-collapse:collapse;font-size:.9rem;">';
      html += '<tr style="border-bottom:2px solid #e5e7eb;text-align:left;"><th style="padding:6px;">ID</th><th>Nombre</th><th style="text-align:center;">P</th><th style="text-align:center;">A</th><th style="text-align:center;">%</th></tr>';
      data.porParticipante.forEach(p => {
        const color = p.porcentaje >= 80 ? '#16a34a' : p.porcentaje >= 50 ? '#f59e0b' : '#dc2626';
        html += `<tr style="border-bottom:1px solid #f3f4f6;">
          <td style="padding:6px;">${p.id}</td>
          <td>${escapar(p.nombre)}</td>
          <td style="text-align:center;">${p.presentes}</td>
          <td style="text-align:center;">${p.ausentes}</td>
          <td style="text-align:center;font-weight:700;color:${color};">${p.porcentaje}%</td>
        </tr>`;
      });
      html += '</table></div>';

      html += '<div style="padding:10px 0;margin-top:20px;"><h2 style="margin:0 0 12px;">Asistencia por sesión</h2><table style="width:100%;border-collapse:collapse;font-size:.9rem;">';
      html += '<tr style="border-bottom:2px solid #e5e7eb;text-align:left;"><th style="padding:6px;">Sesión</th><th style="text-align:center;">Presentes</th><th style="text-align:center;">Total</th><th style="text-align:center;">%</th></tr>';
      data.porSesion.forEach(s => {
        const color = s.porcentaje >= 80 ? '#16a34a' : s.porcentaje >= 50 ? '#f59e0b' : '#dc2626';
        html += `<tr style="border-bottom:1px solid #f3f4f6;">
          <td style="padding:6px;">S${String(s.numero).padStart(2, '0')}</td>
          <td style="text-align:center;">${s.presentes}</td>
          <td style="text-align:center;">${s.total}</td>
          <td style="text-align:center;font-weight:700;color:${color};">${s.porcentaje}%</td>
        </tr>`;
      });
      html += '</table></div>';

      html += '<button class="btn-secundario" style="margin-top:16px;" onclick="cerrarReportes()">Cerrar</button>';

      const panel = document.createElement('section');
      panel.className = 'panel';
      panel.id = 'panelReportes';
      panel.innerHTML = html;
      document.querySelector('main').appendChild(panel);
      panel.scrollIntoView({ behavior: 'smooth' });
    }

    function cerrarReportes() {
      const p = document.getElementById('panelReportes');
      if (p) p.remove();
    }

    function exportarCSV() {
      if (!participantes.length) {
        mostrarToast('Selecciona una sesión primero.', true);
        return;
      }
      const idSesion = document.getElementById('sesion').value;
      let csv = 'id_sesion,id_participante,nombre,estado\n';
      participantes.forEach(p => {
        csv += `${idSesion},${p.id},"${p.nombre}",${p.presente ? 'PRESENTE' : 'AUSENTE'}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `asistencia_${idSesion}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      mostrarToast('CSV descargado.');
    }
  </script>

  <div id="toast" class="toast"></div>

  <footer class="footer-fijo">
    <div class="footer-inner">
      <div class="footer-info">
        <span id="contador">Presentes: 0 / 0</span>
        <span id="estadoSesion" style="font-size:.8rem;color:#6b7280;"></span>
      </div>
      <div class="footer-barra"><div id="barra"></div></div>
      <button id="guardar" class="btn-principal" onclick="guardar()" disabled>
        Guardar asistencia
      </button>
    </div>
  </footer>
</body>
</html>
